<!DOCTYPE html>
<html lang="en">

<head>
       <titel>Shopping Store</titel>
       <style>
              * {1
                     4+++6+

                     ]4\15
                     '[]'
                     margin: 0;
                     padding: 0;
                     box-sizing: border-box;
              }

              body {
                     font-family: Arial;
                     background-color: #F1F3F6;

                     /Header/ header {
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            background: #131921;
                            color: white;
                            padding: 15px;
                     }

                     .logo {
                            font-size: 24px;
                            font-weight: bold;

                            .search input {
                                   padding: 8px;
                                   width: 300px;
                            }
                     }
              }

              h1 {
                     text-align: center;
                     margin: 30px;
              }

              .product-container {
                     display: flex;
                     justify-content: center;
                     gap: 20px;
                     flex-wrap: wrap;
              }

              .product-card {
                     width: 250px;
                     background-color: white;
                     padding: 20px;
                     text-align: center;
                     border-radius: 10px;
                     box-shadow: 0 2px 10px gray;

              }

              .product-image {
                     font-size: 70px;
              }

              .product-card p {
                     Margin: 10px;
              }

              .price {
                     font-size: 22px;
                     font-weight: bold;
              }

              button {
                     padding: 10px 20px;
                     background-color: #ff9f00;
                     color: white;
                     border: none;
                     border-radius: 5px;
                     cursor: pointer;
              }

              buttom:hover {
                     background-color: #ec1e1e;
              }
       </style>
</head>

<body>
       <header>
              <div class="logo">Amazon</div>
              <div class="search">
                     <input type="text" placeholder="Search products" </div>
                     <div class="menu">
                            <a href="#">Login</a>
                            <a href="#">Order</a>
                            <a href="#">Cart</a>
                     </div>
       </header>
       <h1>Top products</h1>
       <div class="product-container">
              <div class="product-card">
                     <div class="product-image">
                     </div>
                     <h2>Mobile</h2>
                     <p>Latest smartphone</p>
                     <p class="price">₹15,999</p>
                     <button>Add to cart</button>
              </div>
              <div class="product-card">
                     <div class="product-image">
                     </div>
                     <h2>Laptop</h2>
                     <p>Powerful laptop</p>
                     <p class="price">₹45,999</p>
                     <button>Add to cart</button>
              </div>
              <div class="product-card">
                     <div class="product-image">
                     </div>
                     <h2>Smart watch</h2>
                     <p>Fitness smart watch</p>
                     <p class="price">₹2,999</p>
                     <button>Add to cart </button>
              </div>
       </div
